[project]
name = "python-web-hello-world"
version = "0.1.0"
description = "Hello, World! implementations for 30+ Python web frameworks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "hasansezertasan", email = "hasansezertasan@gmail.com" }
]
keywords = [
    "python",
    "web",
    "framework",
    "hello-world",
    "wsgi",
    "asgi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/hasansezertasan/python-web-hello-world"
Repository = "https://github.com/hasansezertasan/python-web-hello-world"
